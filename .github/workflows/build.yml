name: Build and Release Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: VideoToSRT-Windows.exe
            file_path: dist/VideoToSRT.exe
          - os: macos-latest
            asset_name: VideoToSRT-macOS
            file_path: dist/VideoToSRT

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller static-ffmpeg

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --collect-all faster_whisper --name VideoToSRT app.py

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --collect-all faster_whisper --name VideoToSRT app.py

    - name: Create or Update Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ matrix.file_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        recreateRelease: false