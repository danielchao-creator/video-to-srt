name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*' # 當你在 Git 推送版本標籤 (例如 v1.0.0) 時自動觸發打包

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: VideoToSRT-Windows.exe
            asset_name: VideoToSRT-Windows
          - os: macos-latest
            artifact_name: VideoToSRT-macOS
            asset_name: VideoToSRT-macOS

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller static-ffmpeg

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --collect-all faster_whisper --collect-all PySide6 --name VideoToSRT app.py

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --collect-all faster_whisper --collect-all PySide6 --name VideoToSRT app.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/*