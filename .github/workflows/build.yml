name: Build and Release Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: VideoToSRT-Windows.zip
            file_path: dist/VideoToSRT-Windows.zip
          - os: macos-latest
            asset_name: VideoToSRT-macOS.zip
            file_path: dist/VideoToSRT-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller static-ffmpeg

    - name: Build and Zip (Windows)
      if: runner.os == 'Windows'
      run: |
        # 移除了 --onefile 與 PySide6，改用資料夾模式，並自動壓縮成 ZIP
        pyinstaller --noconsole --collect-all faster_whisper --name VideoToSRT app.py
        Compress-Archive -Path dist\VideoToSRT\* -DestinationPath dist\VideoToSRT-Windows.zip

    - name: Build and Zip (macOS)
      if: runner.os == 'macOS'
      run: |
        # macOS 加上 --windowed 產生 .app，並自動壓縮成 ZIP
        pyinstaller --noconsole --windowed --collect-all faster_whisper --name VideoToSRT app.py
        cd dist && zip -r VideoToSRT-macOS.zip .

    - name: Create or Update Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ matrix.file_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        recreateRelease: false